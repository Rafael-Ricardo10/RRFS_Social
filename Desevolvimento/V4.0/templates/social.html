<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rede Social · RRFS Social</title>
<style>
:root{--fundo:#0e1418;--painel:#161e24;--painel2:#1c262d;--campo:#0f161b;--tinta:#e4eaee;--suave:#8a9aa6;--linha:#26323b;--cor:#3aa6d8;--cor-t:#06151d;--ok:#5cc489;--erro:#f2877f}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:.5rem .7rem;background:var(--campo);border:1px solid var(--linha);border-radius:8px}
textarea{resize:vertical;min-height:3.2rem}
button{cursor:pointer;padding:.4rem .8rem;border-radius:8px;border:1px solid var(--linha);background:var(--painel2)}
button.pri{background:var(--cor);color:var(--cor-t);border-color:var(--cor);font-weight:600}
button.on{color:var(--cor);border-color:var(--cor)}button.perigo{color:var(--erro)}button.peq{padding:.15rem .5rem;font-size:.82rem}
button.nu{background:none;border:0;padding:.2rem .4rem;color:var(--suave)}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--cor);outline-offset:2px}
a{color:var(--cor)}h2,h3{margin:0;font-weight:600}
label{display:block;font-size:.82rem;color:var(--suave);margin:.6rem 0 .25rem}
.suave{color:var(--suave)}.erro{color:var(--erro)}.ok{color:var(--ok)}.linha{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.cresce{flex:1;min-width:0}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:10;display:flex;gap:.5rem;align-items:center;padding:.5rem 1rem;background:var(--painel);border-bottom:1px solid var(--linha)}
header .logo{font:600 1.2rem Georgia,serif;cursor:pointer;margin-right:.4rem}
header form{flex:1;max-width:26rem}
.bolha{background:var(--erro);color:#fff;border-radius:99px;font-size:.7rem;padding:0 .4rem;margin-left:.25rem;font-weight:700}
#layout{display:grid;grid-template-columns:15rem minmax(0,40rem) 16rem;gap:1rem;justify-content:center;padding:1rem}
.col{position:sticky;top:4rem;align-self:start;max-height:calc(100vh - 5rem);overflow:auto}
.cx{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:.8rem 1rem;margin:0 0 .8rem}
.av{width:2.4rem;height:2.4rem;border-radius:50%;flex:none;background:#2a4352;display:grid;place-items:center;font-weight:700;overflow:hidden;position:relative;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}.av.g{width:7rem;height:7rem;font-size:2.4rem;border:4px solid var(--fundo);cursor:default}
.av .pt{position:absolute;right:0;bottom:0;width:.65rem;height:.65rem;border-radius:50%;background:var(--ok);border:2px solid var(--painel)}
.item{display:flex;gap:.6rem;align-items:center;padding:.4rem .5rem;border-radius:8px;cursor:pointer}.item:hover,.item.at{background:var(--painel2)}
.item .t{min-width:0;flex:1}.item .t b,.item .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .t span{font-size:.8rem;color:var(--suave)}
.sec{margin:.4rem 0 .5rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--suave)}
.hist{display:flex;gap:.7rem;overflow-x:auto;padding-bottom:.3rem}.hist .it{width:4.6rem;text-align:center;font-size:.75rem;cursor:pointer;flex:none}
.hist .av{width:3.6rem;height:3.6rem;margin:0 auto .2rem;box-shadow:0 0 0 2px var(--cor)}.hist .av.vis{box-shadow:0 0 0 2px var(--linha)}
.post .topo{display:flex;gap:.6rem;align-items:center}.post .tx{white-space:pre-wrap;overflow-wrap:anywhere;margin:.6rem 0}
.grade{display:grid;gap:3px;margin:.4rem 0;border-radius:10px;overflow:hidden}
.grade.n1{grid-template-columns:1fr}.grade.n2,.grade.n4{grid-template-columns:1fr 1fr}.grade.n3{grid-template-columns:1fr 1fr}.grade.n3 :first-child{grid-column:1/-1}
.grade img,.grade video{width:100%;height:100%;max-height:26rem;object-fit:cover;display:block;background:#000;cursor:zoom-in}.grade.n1 img,.grade.n1 video{object-fit:contain}
.ph{display:grid;place-items:center;min-height:8rem;background:var(--painel2);color:var(--suave);font-size:.85rem}
.orig{border:1px solid var(--linha);border-radius:10px;padding:.6rem .8rem;margin:.4rem 0;background:var(--painel2)}
.vcard{display:flex;gap:.7rem;border:1px solid var(--linha);border-radius:10px;overflow:hidden;cursor:pointer;margin:.4rem 0;background:var(--painel2)}
.vcard .th{width:9rem;aspect-ratio:16/9;background:linear-gradient(135deg,#17445a,#3b3a5c);flex:none}.vcard .th img{width:100%;height:100%;object-fit:cover}
.vcard .in{padding:.5rem .5rem .5rem 0;min-width:0}.vcard b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acoes{display:flex;border-top:1px solid var(--linha);margin-top:.5rem;padding-top:.3rem;gap:.2rem}.acoes button{flex:1;border:0;background:none}.acoes button.on{background:var(--painel2)}
.com{display:flex;gap:.5rem;margin:.5rem 0}.com .b{background:var(--painel2);border-radius:12px;padding:.3rem .7rem;min-width:0}.com .b div{white-space:pre-wrap;overflow-wrap:anywhere}
.capa{height:13rem;border-radius:12px;background:linear-gradient(120deg,#17445a,#3b3a5c) center/cover}
.abas{display:flex;gap:.2rem;border-bottom:1px solid var(--linha);margin:.8rem 0}.abas button{border:0;border-radius:0;background:none;border-bottom:2px solid transparent;color:var(--suave)}.abas button.at{color:var(--tinta);border-bottom-color:var(--cor)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(8rem,1fr));gap:4px}.fotos img,.fotos video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:zoom-in;background:#000}
.prev{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}.prev div{position:relative}.prev img{width:5rem;height:5rem;object-fit:cover;border-radius:8px}.prev button{position:absolute;top:2px;right:2px;padding:0 .35rem;background:#000b}
#fundo-m{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:30;padding:1rem}
#mod{background:var(--painel);border:1px solid var(--linha);border-radius:12px;width:min(32rem,100%);max-height:92vh;overflow:auto;padding:1rem}#mod.foto{width:auto;background:none;border:0;padding:0;text-align:center}#mod.foto img,#mod.foto video{max-width:96vw;max-height:88vh;border-radius:8px}
.toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--tinta);color:var(--fundo);padding:.5rem 1rem;border-radius:8px;z-index:40;max-width:90vw}
@media(max-width:1000px){#layout{grid-template-columns:minmax(0,1fr);}.col{display:none}}
</style>
</head>
<body>
<header>
 <span class="logo" onclick="go('')">RRFS Social</span>
 <form id="f-busca"><input id="q" placeholder="Buscar pessoas pelo nome" autocomplete="off"></form>
 <button onclick="go('')">Início</button>
 <button onclick="go('p='+EU.pub)">Meu perfil</button>
 <button onclick="go('amigos')">Amigos<span class="bolha" id="b-ped" hidden></span></button>
 <button onclick="avisarPai({tipo:'abrir_ent'})">Entretenimento</button>
 <button onclick="avisarPai({tipo:'voltar'})">‹ Mensagens</button>
</header>
<div id="layout">
 <aside class="col" id="esq"></aside>
 <main id="m"></main>
 <aside class="col" id="dir"></aside>
</div>
<script>
// null/false/undefined não viram texto "null" ao montar a tela
for(const m of ['append','prepend','replaceChildren']){const o=Element.prototype[m];Element.prototype[m]=function(...a){return o.apply(this,a.filter(x=>x!=null&&x!==false))}}
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function h(t,a,...k){const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){
 if(n==='class')e.className=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);
 else if(n==='value')e.value=v;else if(v!==false&&v!=null)e.setAttribute(n,v===true?'':v)}
 for(const c of k.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
async function api(p,m='GET',b){const o={method:m,headers:{'X-RRFS':'1'}};
 if(b instanceof FormData)o.body=b;else if(b!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b)}
 const r=await fetch(p,o);let j={};try{j=await r.json()}catch(e){}
 if(r.status===401){location='/';throw new Error('login')}
 if(!r.ok)throw new Error(j.erro||('Erro '+r.status));return j}
function aviso(t,ruim){const e=h('div',{class:'toast',role:'status'},t);document.body.append(e);setTimeout(()=>e.remove(),ruim?6000:2800)}
async function tenta(fn,ok){try{const r=await fn();if(ok)aviso(ok);return r}catch(e){if(e.message!=='login')aviso(e.message,true)}}
const EMB=window.parent!==window;
function avisarPai(m){if(EMB)parent.postMessage(m,location.origin);else if(m.tipo==='voltar')location='/'}
function fechar(){const f=$('#fundo-m');if(f)f.remove()}
function modal(t,cls,...c){fechar();const m=h('div',{id:'mod',class:cls||''},t?h('div',{class:'linha',style:'margin-bottom:.6rem'},h('h2',{class:'cresce'},t),h('button',{class:'peq',onclick:fechar},'Fechar')):null,...c);
 const f=h('div',{id:'fundo-m',onclick:e=>{if(e.target===f)fechar()}},m);document.body.append(f);return m}
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});
const ago=ts=>{const s=Date.now()/1000-ts;if(s<90)return'agora';if(s<3600)return Math.round(s/60)+' min';if(s<86400)return Math.round(s/3600)+' h';if(s<604800)return Math.round(s/86400)+' d';return new Date(ts*1000).toLocaleDateString()};
const src=x=>!x?'':x.startsWith('data:')?x:'/api/midia/'+x;
function av(mini,nome,on,clique){const a=h('div',{class:'av',onclick:clique});if(mini)a.append(h('img',{src:mini,alt:''}));else a.append((nome||'?').slice(0,1).toUpperCase());if(on)a.append(h('i',{class:'pt'}));return a}
function img2url(file,max,q){return new Promise((res,rej)=>{if(file.type==='image/gif'||file.size<350000&&file.type==='image/jpeg')return res(file);const i=new Image(),u=URL.createObjectURL(file);
 i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);
  c.toBlob(b=>b?res(new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})):rej(new Error('Imagem inválida.')),'image/jpeg',q)};i.onerror=()=>rej(new Error('Imagem inválida.'));i.src=u})}
function mini64(file){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{const m=Math.min(i.width,i.height),c=document.createElement('canvas');c.width=c.height=64;c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,64,64);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.6))};i.onerror=()=>rej(new Error('Imagem inválida.'));i.src=u})}
function dataUrl(file,max,q){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};i.onerror=()=>rej(new Error('Imagem inválida.'));i.src=u})}

let EU={},limpa=[];const aoSair=f=>limpa.push(f);
function go(r){location.hash=r}
function janelinha(c){avisarPai({tipo:'janelinha',cid:'p:'+c.pub,nome:((c.nome||'')+' '+(c.sobrenome||'')).trim(),foto_mini:c.foto_mini||''})}
function abrirVideo(vid){avisarPai({tipo:'abrir_video',vid})}

/* ── laterais ── */
async function laterais(){let st,on,cts;try{[st,on,cts]=await Promise.all([api('/api/estado'),api('/api/online'),api('/api/contatos')])}catch(e){return}
 EU={pub:st.pub,addr:st.addr,...st.perfil};
 const ped=cts.pedidos.length;const b=$('#b-ped');b.hidden=!ped;b.textContent=ped;
 $('#esq').replaceChildren(h('div',{class:'cx'},h('div',{class:'item',onclick:()=>go('p='+EU.pub)},av(EU.foto_mini,EU.nome),h('div',{class:'t'},h('b',{},(EU.nome+' '+EU.sobrenome).trim()),h('span',{},'Ver meu perfil'))),
  h('div',{class:'item',onclick:()=>go('')},'🏠 Início'),h('div',{class:'item',onclick:()=>go('amigos')},'👥 Amigos'+(ped?' ('+ped+' pedidos)':'')),
  h('div',{class:'item',onclick:()=>avisarPai({tipo:'abrir_ent'})},'🎬 Entretenimento'),h('div',{class:'item',onclick:()=>avisarPai({tipo:'voltar'})},'💬 Mensagens')),
  h('div',{class:'cx suave',style:'font-size:.8rem'},st.invisivel?'🔒 Modo privado ligado: seus amigos veem você offline.':'Dica: no Mensageiro, em Conta, você pode ligar o modo privado.'));
 $('#dir').replaceChildren(h('div',{class:'cx'},h('div',{class:'sec'},'Amigos online ('+on.online.length+')'),
  ...(on.online.length?on.online.map(c=>h('div',{class:'item',title:'Conversar',onclick:()=>janelinha(c)},av(c.foto_mini,c.nome,true),h('div',{class:'t'},h('b',{},(c.nome+' '+c.sobrenome).trim()),h('span',{},'clique para conversar')))):[h('div',{class:'suave',style:'font-size:.85rem'},'Ninguém online agora.')])))}

/* ── roteamento ── */
async function render(){limpa.forEach(f=>{try{f()}catch(e){}});limpa=[];fechar();
 const r=decodeURIComponent(location.hash.slice(1)),M=$('#m');M.replaceChildren(h('p',{class:'suave'},'Carregando…'));window.scrollTo(0,0);
 try{if(!EU.pub)await laterais();
  if(r.startsWith('p='))await pgPerfil(M,r.slice(2));else if(r==='amigos')await pgAmigos(M);else if(r.startsWith('b='))await pgBusca(M,r.slice(2));else await pgInicio(M)}
 catch(e){if(e.message!=='login')M.replaceChildren(h('div',{class:'cx'},h('p',{class:'erro'},e.message),h('button',{onclick:()=>go('')},'Voltar ao início')))}}
window.addEventListener('hashchange',render);
$('#f-busca').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(q)go('b='+q)};
let tmr;window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.tipo!=='evento')return;const t=e.data.e.tipo;
 if(['contato','pedido','perfil','status','post'].includes(t)){clearTimeout(tmr);tmr=setTimeout(()=>{laterais();if(atualizaFeed)atualizaFeed()},700)}});
let atualizaFeed=null;setInterval(()=>{if(!document.hidden){laterais();if(atualizaFeed)atualizaFeed()}},6000);

/* ── publicação: criar ── */
function composer(aoPublicar){const tx=h('textarea',{placeholder:'No que você está pensando, '+(EU.nome||'')+'?',maxlength:3000}),arq=h('input',{type:'file',accept:'image/*,video/mp4,video/webm',multiple:true,hidden:true}),prev=h('div',{class:'prev'}),st=h('span',{class:'suave'}),btn=h('button',{class:'pri'},'Publicar');
 let fs=[];const draw=()=>{prev.replaceChildren(...fs.map((f,i)=>h('div',{},f.type.startsWith('video')?h('div',{class:'ph',style:'width:5rem;height:5rem;min-height:0'},'🎞'):h('img',{src:URL.createObjectURL(f),alt:''}),h('button',{onclick:()=>{fs.splice(i,1);draw()}},'✕'))))};
 arq.onchange=()=>{for(const f of arq.files){if(f.type.startsWith('video')){fs=fs.filter(x=>!x.type.startsWith('video'));fs=[f]}else fs=fs.filter(x=>!x.type.startsWith('video')).concat(f)}arq.value='';if(fs.length>10)fs=fs.slice(0,10);draw()};
 btn.onclick=async()=>{if(!tx.value.trim()&&!fs.length)return aviso('Escreva algo ou escolha fotos/vídeo.',true);btn.disabled=true;
  try{const mids=[];for(let i=0;i<fs.length;i++){st.textContent='Enviando '+(i+1)+' de '+fs.length+'…';let f=fs[i];if(f.type.startsWith('image/'))f=await img2url(f,1800,.85);
    const fd=new FormData();fd.append('arquivo',f);mids.push((await api('/api/soc/upload','POST',fd)).mid)}
   await api('/api/soc/post','POST',{texto:tx.value,mids});tx.value='';fs=[];draw();st.textContent='';aviso('Publicado.');aoPublicar&&aoPublicar()}
  catch(e){aviso(e.message,true);st.textContent=''}btn.disabled=false};
 return h('div',{class:'cx'},h('div',{class:'linha',style:'align-items:flex-start'},av(EU.foto_mini,EU.nome),h('div',{class:'cresce'},tx)),prev,
  h('div',{class:'linha',style:'margin-top:.5rem'},h('button',{onclick:()=>arq.click()},'🖼 Foto/vídeo'),arq,st,h('span',{class:'cresce'}),btn))}

/* ── publicação: cartão ── */
function midiasPost(p){const ms=p.midias;if(!ms.length)return null;
 const g=h('div',{class:'grade n'+Math.min(ms.length,4)});
 ms.slice(0,4).forEach((m,i)=>{const u='/api/midia/'+m.local;
  if(m.estado!=='ok'){g.append(h('div',{class:'ph'},m.estado==='falhou'?'Falha ao baixar':'Baixando…'));return}
  if(m.tipo==='video')g.append(h('video',{src:u,controls:true,preload:'metadata',playsinline:true}));
  else g.append(h('img',{src:u,alt:m.nome,loading:'lazy',onclick:()=>modal('','foto',h('img',{src:u,alt:m.nome}))}))});
 if(ms.length>4)g.lastChild.after(h('div',{class:'ph'},'+'+(ms.length-4)+' fotos'));return g}
function cartaoVideo(v){if(!v)return null;if(v.indisponivel)return h('div',{class:'orig suave'},'Vídeo indisponível: '+v.titulo);
 return h('div',{class:'vcard',onclick:()=>abrirVideo(v.vid)},h('div',{class:'th'},v.thumb?h('img',{src:v.thumb,alt:''}):null),h('div',{class:'in'},h('b',{},v.titulo),h('div',{class:'suave',style:'font-size:.8rem'},v.canal+(v.live?' · AO VIVO':'')),h('div',{style:'color:var(--cor);font-size:.85rem'},'▶ Assistir no Entretenimento')))}
function cartao(p,refazer){
 const nome=p.nome,perfil=()=>go('p='+p.autor),coms=h('div'),inp=h('input',{placeholder:'Escreva um comentário…',maxlength:1000});
 const pintaComs=(todos)=>{const l=todos?p.coms:p.coms.slice(-3);coms.replaceChildren(p.ncoms>l.length?h('button',{class:'nu',onclick:()=>pintaComs(true)},'Ver os '+p.ncoms+' comentários'):null,
  ...l.map(c=>h('div',{class:'com'},av('',c.nome),h('div',{},h('div',{class:'b'},h('b',{style:'font-size:.85rem'},c.nome),h('div',{},c.texto)),
   h('span',{class:'suave',style:'font-size:.72rem'},ago(c.ts)+' '),(c.meu_com||p.meu)?h('button',{class:'nu perigo peq',onclick:()=>tenta(async()=>{await api('/api/soc/post/'+p.key+'/comentario/'+c.id,'DELETE');refazer()})},'apagar'):null))))};
 pintaComs(false);
 const enviar=()=>{const t=inp.value.trim();if(t)tenta(async()=>{await api('/api/soc/post/'+p.key+'/comentar','POST',{texto:t});inp.value='';refazer()})};
 inp.onkeydown=e=>{if(e.key==='Enter')enviar()};
 const menu=p.meu?h('div',{class:'linha',style:'gap:.2rem'},h('button',{class:'nu peq',onclick:()=>editar(p,refazer)},'Editar'),h('button',{class:'nu peq perigo',onclick:()=>{if(confirm('Excluir esta publicação? Ela some também dos seus amigos.'))tenta(async()=>{await api('/api/soc/post/'+p.key,'DELETE');refazer()},'Publicação excluída.')}},'Excluir')):null;
 return h('div',{class:'cx post','data-key':p.key},
  h('div',{class:'topo'},av(p.foto_mini,nome,false,perfil),h('div',{class:'cresce'},h('b',{style:'cursor:pointer',onclick:perfil},nome),h('div',{class:'suave',style:'font-size:.78rem'},ago(p.ts)+(p.ed?' · editado':''))),menu),
  p.texto?h('div',{class:'tx'},p.texto):null,
  p.orig?h('div',{class:'orig'},h('b',{},p.orig.nome),h('span',{class:'suave',style:'font-size:.78rem'},' · '+ago(p.orig.ts)),h('div',{style:'white-space:pre-wrap;margin-top:.2rem'},p.orig.texto)):null,
  midiasPost(p),cartaoVideo(p.video),
  (p.ncurt||p.ncoms)?h('div',{class:'suave',style:'font-size:.82rem;margin-top:.3rem'},(p.ncurt?'👍 '+p.ncurt:'')+(p.ncurt&&p.ncoms?' · ':'')+(p.ncoms?p.ncoms+' comentário(s)':'')):null,
  h('div',{class:'acoes'},h('button',{class:p.meu_curtir?'on':'',onclick:()=>tenta(async()=>{await api('/api/soc/post/'+p.key+'/curtir','POST',{on:!p.meu_curtir});refazer()})},'👍 Curtir'),h('button',{onclick:()=>inp.focus()},'💬 Comentar'),h('button',{onclick:()=>compartilhar(p,refazer)},'↗ Compartilhar')),
