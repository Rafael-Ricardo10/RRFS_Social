<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RRFS Social</title>
<style>
:root{--fundo:#0e1418;--painel:#161e24;--painel2:#1c262d;--campo:#0f161b;--tinta:#e4eaee;--suave:#8a9aa6;--linha:#26323b;--cor:#3aa6d8;--cor-t:#06151d;--meu:#17445a;--ok:#5cc489;--aviso:#e0a24a;--erro:#f2877f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fundo);color:var(--tinta);font:15px/1.45 system-ui,"Segoe UI",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:.55rem .7rem;background:var(--campo);border:1px solid var(--linha);border-radius:6px}
textarea{resize:vertical;min-height:4rem}
button{cursor:pointer;padding:.45rem .85rem;border-radius:6px;border:1px solid var(--linha);background:var(--painel2)}
button.pri{background:var(--cor);color:var(--cor-t);border-color:var(--cor);font-weight:600}
button.perigo{color:var(--erro)}
button.peq{padding:.2rem .55rem;font-size:.85rem}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--cor);outline-offset:2px}
h2,h3{margin:0;font-weight:600}
label{display:block;font-size:.82rem;color:var(--suave);margin:.7rem 0 .25rem}
.suave{color:var(--suave)}.ok{color:var(--ok)}.erro{color:var(--erro)}.aviso{color:var(--aviso)}
.linha{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.cresce{flex:1;min-width:0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;word-break:break-all}
.caixa{background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:.8rem 1rem;margin:0 0 .7rem}
[hidden]{display:none!important}
#app{display:grid;grid-template-columns:26rem 1fr;height:100%}
#lado{display:flex;flex-direction:column;border-right:1px solid var(--linha);background:var(--painel);min-height:0}
#topo{padding:.7rem .9rem;border-bottom:1px solid var(--linha)}
#topo .nome{font-weight:600}
#abas{display:flex;border-bottom:1px solid var(--linha);overflow-x:auto}
#abas button{flex:1 0 auto;white-space:nowrap;border:0;border-radius:0;background:transparent;padding:.6rem .4rem;font-size:.8rem;color:var(--suave);border-bottom:2px solid transparent;position:relative}
#abas button.at{color:var(--tinta);border-bottom-color:var(--cor)}
.bolha{background:var(--cor);color:var(--cor-t);border-radius:99px;font-size:.7rem;padding:0 .4rem;margin-left:.25rem;font-weight:700}
#lista{flex:1;overflow:auto;padding:.6rem}
#centro{display:flex;flex-direction:column;min-width:0;min-height:0}
.item{display:flex;gap:.65rem;align-items:center;padding:.55rem .6rem;border-radius:8px;cursor:pointer}
.item:hover,.item.at{background:var(--painel2)}
.item .t{min-width:0;flex:1}.item .t b,.item .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:.82rem;color:var(--suave)}
.av{width:2.5rem;height:2.5rem;border-radius:50%;flex:none;background:#2a4352;display:grid;place-items:center;font-weight:700;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av.g{background:#3b3a5c}
.pt{position:absolute;right:0;bottom:0;width:.7rem;height:.7rem;border-radius:50%;background:var(--ok);border:2px solid var(--painel)}
#vazio{margin:auto;color:var(--suave);text-align:center;padding:2rem}
#cab{display:flex;gap:.7rem;align-items:center;padding:.6rem .9rem;border-bottom:1px solid var(--linha);background:var(--painel)}
#voltar{display:none}
#msgs{flex:1;overflow:auto;padding:.9rem;display:flex;flex-direction:column;gap:.35rem}
.m{max-width:min(34rem,82%);padding:.4rem .65rem;border-radius:10px;background:var(--painel2);align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.m.meu{background:var(--meu);align-self:flex-end}
.m .quem{font-size:.78rem;color:var(--cor);font-weight:600}
.m .txt{white-space:pre-wrap}
.m .hora{font-size:.7rem;color:var(--suave);text-align:right;margin-top:.1rem}
.m img.mi,.m video{max-width:100%;max-height:22rem;border-radius:6px;display:block;margin:.2rem 0}
.m audio{max-width:100%}
.sis{align-self:center;font-size:.8rem;color:var(--suave);background:var(--painel);padding:.1rem .7rem;border-radius:99px}
#comp{display:flex;gap:.5rem;padding:.6rem .9rem;border-top:1px solid var(--linha);background:var(--painel);align-items:flex-end}
#comp textarea{min-height:2.4rem;max-height:8rem;resize:none}
.capa{height:7rem;border-radius:8px;background:linear-gradient(120deg,#17445a,#3b3a5c) center/cover;margin-bottom:-2rem}
.perf{display:flex;gap:.8rem;align-items:flex-end;padding:0 .8rem}
.perf .av{width:4.5rem;height:4.5rem;border:3px solid var(--painel);font-size:1.5rem}
#fundo-m{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:1rem}
#mod{background:var(--painel);border:1px solid var(--linha);border-radius:10px;width:min(34rem,100%);max-height:92vh;overflow:auto;padding:1rem}
#mod.largo{width:min(46rem,100%)}
.toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--tinta);color:var(--fundo);padding:.55rem 1rem;border-radius:8px;z-index:30;max-width:90vw}
.sec{margin:.9rem 0 .4rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--suave)}
.anel{box-shadow:0 0 0 2px var(--cor)}
.st{width:100%;max-height:60vh;object-fit:contain;border-radius:8px;display:block;margin:.5rem 0}
.sttxt{font-size:1.3rem;padding:2rem 1rem;text-align:center;background:var(--painel2);border-radius:8px;white-space:pre-wrap}
#apps{display:flex;gap:.4rem;padding:.45rem .6rem;border-bottom:1px solid var(--linha)}#apps button{flex:1}
#socwrap{position:fixed;inset:0;z-index:24;background:var(--fundo)}#socwrap iframe{border:0;width:100%;height:100%;display:block}
#janelas{position:fixed;right:17rem;bottom:0;display:flex;gap:.6rem;align-items:flex-end;z-index:35}
.jan{width:18rem;height:24rem;background:var(--painel);border:1px solid var(--linha);border-radius:10px 10px 0 0;box-shadow:0 0 20px #0009;display:flex;flex-direction:column}
.jan.min{height:2.6rem}.jan.min .jc,.jan.min .jf{display:none}.jan.nova .jh{background:#17445a}
.jh{display:flex;gap:.4rem;align-items:center;padding:.25rem .5rem;cursor:pointer;border-bottom:1px solid var(--linha);height:2.6rem;flex:none}.jh .av{width:1.8rem;height:1.8rem;font-size:.8rem}.jh b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jh button{background:none;border:0;padding:.1rem .35rem;color:var(--suave)}
.jc{flex:1;overflow:auto;padding:.5rem;display:flex;flex-direction:column;gap:.25rem}
.jf{display:flex;gap:.3rem;padding:.4rem;border-top:1px solid var(--linha);align-items:center}.jf button{background:none;border:0;padding:.1rem .4rem}
.jm{max-width:85%;padding:.3rem .55rem;border-radius:10px;background:var(--painel2);align-self:flex-start;font-size:.88rem;overflow-wrap:anywhere;white-space:pre-wrap}
.jm.meu{background:var(--meu);align-self:flex-end}.jm img{max-width:100%;border-radius:6px;display:block}.jm.sis{align-self:center;background:none;color:var(--suave);font-size:.75rem}
#bannerrem{position:fixed;top:0;left:0;right:0;z-index:70;background:#5a3a12;color:#fff;text-align:center;padding:.35rem;font-size:.85rem}
@media(max-width:1000px){#janelas{right:.5rem}}
#notifs{position:fixed;top:.6rem;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:.4rem;width:min(26rem,94vw)}
.notif{background:var(--painel2);border:1px solid var(--cor);border-radius:10px;padding:.55rem .8rem;cursor:pointer;box-shadow:0 6px 20px #000a}
.notif b,.notif span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.notif span{color:var(--suave);font-size:.85rem}
#entwrap{position:fixed;z-index:25;background:#000;overflow:hidden;box-shadow:0 8px 30px #000a;border:1px solid var(--linha);border-radius:10px}
#entwrap iframe{border:0;width:100%;height:100%;display:block;background:var(--fundo)}
#entwrap.full{inset:0;border-radius:0;border:0}#entwrap.full #entbar{display:none}
#entwrap.mini{right:1rem;bottom:5.2rem;width:22rem;height:14.3rem;z-index:30;display:flex;flex-direction:column}
#entwrap.mini iframe{flex:1;min-height:0}#entwrap.oculto{display:none}
#entbar{display:flex;gap:.3rem;align-items:center;padding:.15rem .4rem;background:var(--painel);font-size:.78rem;height:1.9rem}
#entbar #enttit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chamada{position:fixed;top:.6rem;right:.6rem;z-index:40;width:min(30rem,96vw);background:#0b1115;border:1px solid var(--linha);border-radius:12px;box-shadow:0 10px 36px #000c;overflow:hidden}
#chamada.cheia{inset:0;width:auto;border-radius:0;display:flex;flex-direction:column;z-index:55}
#chamada.min #cgrade{display:none}
#cgrade{display:grid;gap:4px;padding:4px;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));max-height:70vh;overflow:auto}
#chamada.cheia #cgrade{flex:1;max-height:none;grid-auto-rows:1fr}
.tl{position:relative;background:#16222a;border-radius:8px;aspect-ratio:16/10;overflow:hidden;display:grid;place-items:center;min-height:6rem}
.tl video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.tl.semvid video{visibility:hidden}.tl:not(.semvid) .av{display:none}.tl.eu{outline:2px solid var(--cor)}
.tl .nm{position:absolute;left:.4rem;bottom:.3rem;background:#000a;color:#fff;font-size:.75rem;border-radius:4px;padding:0 .4rem}
.tl .st{position:absolute;right:.4rem;top:.3rem;background:#000a;color:#fff;font-size:.7rem;border-radius:4px;padding:0 .4rem}
#cctl{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;padding:.5rem;background:var(--painel)}
#cctl button.off{background:#4a2020}
#cbarra{display:flex;gap:.4rem;align-items:center;padding:.4rem .6rem;background:var(--painel);font-size:.85rem}
#toca{position:fixed;inset:0;z-index:58;background:#000b;display:grid;place-items:center;padding:1rem}
#toca .cx{background:var(--painel);border:1px solid var(--cor);border-radius:12px;padding:1.2rem 1.6rem;text-align:center;width:min(22rem,100%)}
#bannerch{padding:.4rem .9rem;background:#133a2a;border-bottom:1px solid var(--linha);display:flex;gap:.6rem;align-items:center}
@media(max-width:760px){#entwrap.mini{width:13rem;height:9.3rem;bottom:4.6rem;right:.5rem}
 #app{grid-template-columns:1fr}
 #centro{display:none}
 body.chat #lado{display:none}body.chat #centro{display:flex}
 #voltar{display:inline-block}
}
</style>
</head>
<body>
<div id="app">
 <aside id="lado">
  <div id="topo">
   <div class="linha"><span class="nome cresce" id="t-nome"></span><span id="t-rede" class="suave" style="font-size:.8rem"></span></div>
   <div id="t-info" class="suave" style="font-size:.78rem"></div>
  </div>
  <nav id="abas"></nav>
  <div id="apps"><button onclick="abrirSoc()">🌐 Rede Social</button><button onclick="abrirEnt()">🎬 Entretenimento</button></div>
  <div id="lista"></div>
 </aside>
 <section id="centro">
  <div id="vazio">Escolha uma conversa ou adicione contatos na aba Contatos.</div>
 </section>
</div>
<script>
// null/false/undefined não viram texto "null" ao montar a tela
for(const m of ['append','prepend','replaceChildren']){const o=Element.prototype[m];Element.prototype[m]=function(...a){return o.apply(this,a.filter(x=>x!=null&&x!==false))}}
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function h(t,a,...k){const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){
 if(n==='class')e.className=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);
 else if(n==='value')e.value=v;else if(v!==false&&v!=null)e.setAttribute(n,v===true?'':v)}
 for(const c of k.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
async function api(p,m='GET',b){const o={method:m,headers:{'X-RRFS':'1'}};
 if(b instanceof FormData)o.body=b;else if(b!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b)}
 const r=await fetch(p,o);let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&!p.includes('login')){location='/';throw new Error('login')}
 if(!r.ok)throw new Error(j.erro||('Erro '+r.status));return j}
function aviso(t,ruim){const e=h('div',{class:'toast',role:'status'},t);document.body.append(e);setTimeout(()=>e.remove(),ruim?6000:2800)}
async function tenta(fn,ok){try{const r=await fn();if(ok)aviso(ok);return r}catch(e){if(e.message!=='login')aviso(e.message,true)}}
function copiar(t){navigator.clipboard.writeText(t).then(()=>aviso('Copiado.'),()=>aviso('Não foi possível copiar.',true))}
function hora(ts){const d=new Date(ts*1000),hj=new Date();return d.toDateString()===hj.toDateString()?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([],{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function av(mini,nome,grupo,online){const a=h('div',{class:'av'+(grupo?' g':'')});
 if(mini)a.append(h('img',{src:mini,alt:''}));else a.append((nome||'?').trim().slice(0,1).toUpperCase());
 if(online)a.append(h('i',{class:'pt'}));return a}
function img2url(file,max,q,quad){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(file);
 i.onload=()=>{let w=i.width,hh=i.height,sx=0,sy=0,sw=w,sh=hh;
  if(quad){const m=Math.min(w,hh);sx=(w-m)/2;sy=(hh-m)/2;sw=sh=m;w=hh=max}else{const k=Math.min(1,max/Math.max(w,hh));w=Math.round(w*k);hh=Math.round(hh*k)}
  const c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(i,sx,sy,sw,sh,0,0,w,hh);
  URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};
 i.onerror=()=>rej(new Error('Imagem inválida.'));i.src=u})}
function modal(titulo,largo,...c){fechar();const m=h('div',{id:'mod',class:largo?'largo':''},
 h('div',{class:'linha',style:'margin-bottom:.6rem'},h('h2',{class:'cresce'},titulo),h('button',{class:'peq',onclick:fechar},'Fechar')),...c);
 const f=h('div',{id:'fundo-m',onclick:e=>{if(e.target===f)fechar()}},m);document.body.append(f);return m}
function fechar(){const f=$('#fundo-m');if(f)f.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});

let est={},aba='conversas',cid=null,convs=[],evN=0,eu={};
const ABAS=[['conversas','Conversas'],['contatos','Contatos'],['grupos','Grupos'],['status','Status'],['conta','Conta']];

/* ── topo / abas ── */
async function topo(){try{est=await api('/api/estado')}catch(e){return}
 eu=est.perfil;$('#t-nome').textContent=(eu.nome+' '+eu.sobrenome).trim();
 $('#t-rede').textContent=['● sem rede','● TCP','● UDP'][est.rede];$('#t-rede').className=est.rede?'ok':'erro';
 $('#t-info').textContent=est.conectados+' conectados · '+est.diretorio+' no diretório'+(est.fila?' · '+est.fila+' na fila de envio':'');
 const n={conversas:est.nao_lidas,contatos:est.pedidos,grupos:est.convites};
 $('#abas').replaceChildren(...ABAS.map(([k,t])=>h('button',{class:k===aba?'at':'',onclick:()=>{if(k==='ent'){abrirEnt();return}aba=k;lista()}},t,n[k]?h('span',{class:'bolha'},n[k]):null)));
 document.title=(est.nao_lidas?'('+est.nao_lidas+') ':'')+'RRFS Social'}
async function lista(){await topo();const L=$('#lista');L.replaceChildren();
 try{await ({conversas:vConversas,contatos:vContatos,grupos:vGrupos,status:vStatus,conta:vConta})[aba](L)}catch(e){if(e.message!=='login')aviso(e.message,true)}}

/* ── conversas ── */
async function vConversas(L){convs=(await api('/api/conversas')).conversas;
 if(!convs.length)L.append(h('p',{class:'suave',style:'padding:.5rem'},'Nenhuma conversa ainda. Adicione um contato ou crie um grupo.'));
 for(const c of convs)L.append(h('div',{class:'item'+(c.cid===cid?' at':''),onclick:()=>abrir(c.cid,c)},
  av(c.foto_mini,c.nome,c.grupo,c.online),
  h('div',{class:'t'},h('b',{},c.nome),h('span',{},c.previa||'')),
  h('div',{style:'text-align:right'},h('div',{class:'suave',style:'font-size:.72rem'},hora(c.ts)),c.nao_lidas?h('span',{class:'bolha'},c.nao_lidas):null)))}
async function abrir(id,info){cid=id;document.body.classList.add('chat');
 if(!info)info=convs.find(c=>c.cid===id)||{nome:id.startsWith('g:')?'Grupo':'Conversa'};
 const grupo=id.startsWith('g:'),somenteLeitura=grupo&&info.estado&&info.estado!=='ativo';
 let sil=false;try{sil=(await api('/api/silenciados')).silenciados.some(x=>x.cid===id)}catch(e){}
 const silBtn=h('button',{class:'peq',title:'Silenciar notificações desta conversa',onclick:async()=>{const n=!sil;if(await tenta(()=>api('/api/silenciar','POST',{cid:id,on:n}))!==undefined){sil=n;silBtn.textContent=sil?'🔕 Silenciada':'🔔 Notificar'}}},sil?'🔕 Silenciada':'🔔 Notificar');
 const banner=h('div',{id:'bannerch',hidden:true});
 const C=$('#centro');
 const msgs=h('div',{id:'msgs'});
 const txt=h('textarea',{rows:1,placeholder:'Escreva uma mensagem',maxlength:8000});
 const arq=h('input',{type:'file',hidden:true});
 const enviar=async()=>{const t=txt.value.trim();if(!t)return;txt.value='';
  if(await tenta(()=>api('/api/enviar','POST',{cid,texto:t}))===undefined)txt.value=t;carregar()};
 txt.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar()}};
 arq.onchange=async()=>{const f=arq.files[0];if(!f)return;const fd=new FormData();fd.append('cid',cid);fd.append('arquivo',f);fd.append('legenda',txt.value.trim());txt.value='';
  aviso('Enviando '+f.name+'…');await tenta(()=>api('/api/enviar_arquivo','POST',fd),'Arquivo enviado.');arq.value='';carregar()};
 C.replaceChildren(
  h('div',{id:'cab'},h('button',{id:'voltar',onclick:()=>{document.body.classList.remove('chat')}},'‹'),
   av(info.foto_mini,info.nome,grupo,info.online),h('div',{class:'cresce'},h('b',{},info.nome),h('div',{class:'suave',style:'font-size:.78rem'},grupo?'Grupo':(info.online?'online':'offline'))),
   somenteLeitura?null:[h('button',{class:'peq',onclick:()=>ligar(id,false)},'📞 Voz'),h('button',{class:'peq',onclick:()=>ligar(id,true)},'🎥 Vídeo')],silBtn,
   h('button',{class:'peq',onclick:()=>grupo?infoGrupo(id.slice(2)):perfilContato(id.slice(2))},grupo?'Info do grupo':'Perfil')),
  banner,msgs,
  somenteLeitura?h('div',{class:'suave',style:'padding:.8rem;text-align:center'},'Você não participa mais deste grupo.'):
  h('div',{id:'comp'},h('button',{onclick:()=>arq.click(),title:'Anexar'},'＋'),arq,txt,h('button',{class:'pri',onclick:enviar},'Enviar')));
 atualizaBanner();await carregar(true);api('/api/lido','POST',{cid}).then(topo);if(aba==='conversas')lista();txt.focus()}
function bolhaArq(m){const a=m.arq,u='/api/midia/'+a.local;
 if(a.estado==='ok'){
  if(m.tipo==='imagem')return h('a',{href:u,target:'_blank'},h('img',{class:'mi',src:u,alt:a.nome,loading:'lazy'}));
  if(m.tipo==='video')return h('video',{src:u,controls:true,preload:'metadata'});
  if(m.tipo==='audio')return h('audio',{src:u,controls:true});
  return h('a',{href:u,download:a.nome},'Baixar '+a.nome+' ('+tam(a.tam)+')')}
 if(a.estado==='pendente')return h('div',{class:'suave'},a.nome+' · baixando'+(a.progresso!=null?' '+a.progresso+'%':'…'));
 return h('div',{},a.nome+' ('+tam(a.tam)+') ',h('button',{class:'peq',onclick:()=>tenta(async()=>{await api('/api/baixar','POST',{cid,mid:m.id});carregar()})},a.estado==='falhou'?'Tentar de novo':'Baixar'))}
function tam(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
const TQ={pendente:'○',enviada:'✓',entregue:'✓✓',recebida:''};
async function carregar(fundo){if(!cid)return;const id=cid;let r;try{r=await api('/api/conversa/'+encodeURIComponent(id))}catch(e){return}
 if(id!==cid)return;const box=$('#msgs');if(!box)return;const perto=fundo||box.scrollHeight-box.scrollTop-box.clientHeight<120;

const PREF=Object.assign({tela:true,sistema:false,som:true},(()=>{try{return JSON.parse(localStorage.getItem('rrfs_prefs')||'{}')}catch(e){return{}}})());

let _ac;function ctxAudio(){_ac=_ac||new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac}
function tom(f,d,v=.12,t0=0){try{const a=ctxAudio(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);
 const t=a.currentTime+t0;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.02)}catch(e){}}
const bip=()=>{if(PREF.som){tom(880,.16);tom(1175,.2,.1,.15)}};
function notificar(e){

 const j=jan[e.cid];
 if(j){atualizaJan(e.cid);if(j.el.classList.contains('min')||document.hidden){j.el.classList.add('nova');bip()}return}
 if(soc.visivel&&ent.modo!=='full'&&!document.hidden){abrirJanelinha(e.cid,e.titulo||'Conversa','');bip();return}   // rede social aberta: janelinha
 if(e.cid===cid&&!document.hidden&&ent.modo!=='full'&&!soc.visivel)return; // já está vendo esta conversa
 if(PREF.tela)toastMsg(e);
 if(PREF.sistema&&document.hidden&&window.Notification&&Notification.permission==='granted'){
  const n=new Notification(e.titulo||'RRFS Social',{body:(e.grupo?e.quem+': ':'')+(e.previa||'Nova mensagem'),tag:e.cid});
  n.onclick=()=>{window.focus();irParaConversa(e.cid);n.close()}}

   h('button',{title:'Abrir no Mensageiro',onclick:ev=>{ev.stopPropagation();irParaConversa(c)}},'⤢'),h('button',{onclick:ev=>{ev.stopPropagation();fecharJan(c)}},'✕')),corpo,h('div',{class:'jf'},h('button',{onclick:()=>arq.click(),title:'Enviar arquivo'},'＋'),arq,inp));
 jan[c]={el,corpo,inp};while(box.children.length>=3)box.firstChild.remove();box.append(el);atualizaJan(c);inp.focus()}
async function atualizaJan(c){const j=jan[c];if(!j)return;let r;try{r=await api('/api/conversa/'+encodeURIComponent(c)+'?limite=30')}catch(e){return}
 const fundo=j.corpo.scrollHeight-j.corpo.scrollTop-j.corpo.clientHeight<60||!j.corpo.children.length;
 j.corpo.replaceChildren(...r.mensagens.map(m=>{if(m.tipo==='sistema')return h('div',{class:'jm sis'},m.texto);
  const b=h('div',{class:'jm'+(m.meu?' meu':'')});
  if(m.arq){const u='/api/midia/'+m.arq.local;b.append(m.arq.estado!=='ok'?(m.arq.nome+' · '+(m.arq.estado==='pendente'?'baixando…':'falhou')):m.tipo==='imagem'?h('img',{src:u,alt:m.arq.nome}):h('a',{href:u,download:m.arq.nome,style:'color:var(--cor)'},'📎 '+m.arq.nome))}
  if(m.tipo==='video_ref')b.append(h('a',{href:'#',style:'color:var(--cor)',onclick:ev=>{ev.preventDefault();abrirEnt('#v='+m.vid)}},'▶ '+m.texto));
  else if(m.texto)b.append((m.arq?h('div',{}):'') ,m.texto);
  return b}));
 if(fundo)j.corpo.scrollTop=j.corpo.scrollHeight;
 if(!j.el.classList.contains('min')&&!document.hidden)api('/api/lido','POST',{cid:c}).then(topo)}
/* aparelho vinculado: aviso quando o principal está offline */
async function verRemoto(){try{const r=await api('/api/remoto/estado');let b=$('#bannerrem');
 if(r.remoto&&!r.principal_online){if(!b)document.body.append(h('div',{id:'bannerrem'},'O aparelho principal está offline. Você vê os dados mais recentes quando ele voltar a ficar ligado e conectado.'))}else if(b)b.remove()}catch(e){}}
setInterval(verRemoto,8000);verRemoto();

lista();eventos();carregaChamadas();setInterval(()=>{if(!document.hidden){topo();if(cid)carregar()}},8000);
